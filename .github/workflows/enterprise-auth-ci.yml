name: Enterprise Auth CI & Container Build

permissions:
  contents: read

on:
  push:
    branches:
      - 'feature/enterprise-auth-workspace'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Enterprise Auth & Multi-Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: explorer/package-lock.json

      - name: Install and test Explorer frontend
        working-directory: explorer
        run: |
          npm ci
          npm run test:auth-frontend
          npm run build

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies with uv
        run: |
          uv sync --extra explorer

      - name: Run Enterprise Auth & Multi-Workspace Backend Test Suite
        run: |
          uv run pytest tests/test_auth_metadata_store.py \
                        tests/test_ldap_jwt_login.py \
                        tests/test_workspace_session_routing.py \
                        tests/test_federated_graphrag.py \
                        tests/test_api_key_admin_endpoints.py \
                        tests/explorer/test_explorer_auth.py -v

  build-image:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: |
          docker build -t semantica-knowledge-explorer:ci .

      - name: Verify Container Health
        run: |
          docker run -d --name semantica-ci-test -p 8000:8000 \
            -e SEMANTICA_ALLOW_ANONYMOUS=true \
            semantica-knowledge-explorer:ci
          
          # Wait for container startup and health check
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'; then
              echo "Healthcheck successfully passed on attempt $i!"
              break
            fi
            echo "Waiting for container API to be healthy... ($i/15)"
            sleep 2
          done

          # Final verification check
          curl -f http://127.0.0.1:8000/api/health || (docker logs semantica-ci-test && exit 1)

      - name: Teardown test container
        if: always()
        run: |
          docker stop semantica-ci-test 2>/dev/null || true
          docker rm semantica-ci-test 2>/dev/null || true
